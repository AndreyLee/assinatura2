<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Assinatura de E-mail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gerador de Assinatura</h1>
        <form id="signature-form">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label for="setor">Setor:</label>
                <input type="text" id="setor" required>
            </div>
            <div class="form-group">
                <label for="ramal">Ramal:</label>
                <input type="text" id="ramal" required>
            </div>
            <button type="submit">Gerar Assinatura</button>
        </form>

        <div class="preview-container">
            <h2>Pré-visualização</h2>
            <div id="preview"></div>
            <button id="copy-btn" disabled>Copiar Assinatura</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Assinatura de E-mail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gerador de Assinatura Institucional</h1>
        <form id="signature-form">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="setor">Setor:</label>
                <input type="text" id="setor" name="setor" required>
            </div>
            <div class="form-group">
                <label for="ramal">Ramal:</label>
                <input type="text" id="ramal" name="ramal" required>
            </div>
            <button type="submit" id="gerarAssinaturaBtn">Gerar Assinatura</button>
        </form>

        <div class="preview-container">
            <h2>Pré-visualização</h2>
            <div id="previewAssinatura">
                <!-- A imagem da assinatura aparecerá aqui -->
            </div>
            <button id="copiarAssinaturaBtn" disabled>Copiar Assinatura</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

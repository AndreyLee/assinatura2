<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Assinatura de E-mail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gerador de Assinatura de E-mail</h1>
        <form id="assinatura-form">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="setor">Setor:</label>
                <input type="text" id="setor" name="setor" required>
            </div>
            <div class="form-group">
                <label for="ramal">Ramal:</label>
                <input type="text" id="ramal" name="ramal" required>
            </div>
            <button type="submit">Gerar Assinatura</button>
        </form>

        <div class="preview-container">
            <h2>Pré-visualização da Assinatura</h2>
            <div id="preview">
                <img id="assinatura-img" src="" alt="Sua assinatura aparecerá aqui">
            </div>
            <button id="copiar-btn" disabled>Copiar para Área de Transferência</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
